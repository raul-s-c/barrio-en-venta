services:
  game:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - barrio-data:/app/data
      - ./secrets/firebase-service-account.json:/run/secrets/firebase.json:ro
    expose:
      - "8788"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  barrio-data:
  caddy-data:
  caddy-config:
